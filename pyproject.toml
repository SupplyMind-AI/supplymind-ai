[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supplymind-ai"
version = "0.1.0"
description = "AI-powered supply-chain delay-risk intelligence platform"
requires-python = ">=3.11,<3.12"

dependencies = [
    "sqlalchemy>=2.0,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.18,<2",
    "pydantic-settings>=2.10,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "langchain>=1.1,<2",
    "langgraph>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langsmith>=0.4,<1",
    "pinecone>=7,<10",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=1.1,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]