services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: supplymind
      POSTGRES_USER: supplymind
      POSTGRES_PASSWORD: supplymind
    ports:
      - "5432:5432"
    volumes:
      - supplymind_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplymind -d supplymind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  supplymind_postgres_data:
