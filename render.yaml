services:
  - type: web
    name: supplymind-api
    runtime: python
    plan: starter
    buildCommand: pip install -e .
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: postgresql://supplymind:lGEce9GLogx8466dDqgSy9NFF6itZmat@dpg-d9uo9efavr4c73b2uq30-a.frankfurt-postgres.render.com/supplymind_0vfa
        fromDatabase:
          name: supplymind-postgres
          property: connectionString
      - key: DATABASE_ECHO
        value: "false"
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_MAX_OVERFLOW
        value: "10"
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_HOST
        sync: false
      - key: PINECONE_NAMESPACE_DOCUMENTS
        value: enterprise-documents
      - key: OPEN_METEO_BASE_URL
        value: https://api.open-meteo.com/v1
      - key: GDELT_BASE_URL
        value: https://api.gdeltproject.org/api/v2/doc/doc
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_PROJECT
        value: supplymind-ai-production
      - key: MODEL_REGISTRY_PATH
        value: models
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.15"
      - key: PYTHON_VERSION
        value: "3.11.15"

databases:
  - name: supplymind-postgres
    plan: starter
    databaseName: supplymind
    user: supplymind
